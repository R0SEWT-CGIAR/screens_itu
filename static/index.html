<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiosco</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 24px;
      min-height: 100vh;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 24px; color: #f8fafc; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 28px;
    }

    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #334155;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #ef4444;
      flex-shrink: 0;
    }
    .dot.connected { background: #22c55e; }

    .card-title { font-weight: 600; font-size: 1rem; }
    .card-subtitle {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 2px;
    }

    .now-casting {
      background: #0f172a;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 14px;
      font-size: 0.8rem;
      min-height: 48px;
    }
    .now-casting .label { color: #94a3b8; font-size: 0.7rem; margin-bottom: 4px; }
    .now-casting .title { font-weight: 600; color: #f1f5f9; }
    .now-casting .url { color: #64748b; font-size: 0.7rem; word-break: break-all; margin-top: 2px; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-start { background: #22c55e; color: #052e16; }
    .btn-stop  { background: #ef4444; color: #fff; }
    .btn-cast  { background: #3b82f6; color: #fff; padding: 5px 10px; font-size: 0.75rem; }

    .links-section { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
    .links-section h2 { font-size: 1rem; font-weight: 600; margin-bottom: 14px; color: #f8fafc; }

    .link-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #1e293b;
    }
    .link-row:last-child { border-bottom: none; }
    .link-info { flex: 1; min-width: 0; }
    .link-info .name { font-weight: 500; font-size: 0.875rem; }
    .link-info .href { font-size: 0.7rem; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .link-actions { display: flex; gap: 6px; flex-shrink: 0; }

    .interval-bar {
      background: #1e293b;
      border-radius: 12px;
      padding: 18px 20px;
      border: 1px solid #334155;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .interval-bar label { font-size: 0.875rem; font-weight: 500; color: #94a3b8; white-space: nowrap; }
    .interval-bar input[type=range] { flex: 1; min-width: 120px; accent-color: #3b82f6; }
    .interval-val {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.875rem;
      font-weight: 600;
      color: #f1f5f9;
      min-width: 60px;
      text-align: center;
    }
    .btn-apply {
      background: #3b82f6;
      color: #fff;
      padding: 6px 14px;
      border-radius: 8px;
      border: none;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-apply:hover { opacity: 0.85; }
  </style>
</head>
<body>

<h1>Quiosco</h1>

<div class="interval-bar">
  <label>Intervalo de rotacion</label>
  <input type="range" id="slider" min="5" max="300" step="5" value="30">
  <span class="interval-val"><span id="sliderVal">30</span>s</span>
  <button class="btn-apply" onclick="applyInterval()">Aplicar</button>
  <a class="btn-apply" href="/cast/startup-check" target="_blank" rel="noopener noreferrer" style="text-decoration:none; display:inline-flex; align-items:center;">
    Debug interno
  </a>
</div>

<div class="grid" id="chromecasts"></div>

<div class="links-section">
  <h2>Links</h2>
  <div id="linksList"></div>
</div>

<script>
  let state = { chromecasts: [], links: [], interval_seconds: 30 };
  let sliderActive = false;

  async function fetchStatus() {
    try {
      const res = await fetch('/api/status');
      state = await res.json();
      render();
    } catch (e) { console.error(e); }
  }

  function render() {
    renderChromecasts();
    renderLinks();
    if (!sliderActive) {
      document.getElementById('slider').value = state.interval_seconds;
      document.getElementById('sliderVal').textContent = state.interval_seconds;
    }
  }

  function renderChromecasts() {
    const el = document.getElementById('chromecasts');
    el.innerHTML = state.chromecasts.map(cc => `
      <div class="card">
        <div class="card-header">
          <div class="dot ${cc.connected ? 'connected' : ''}"></div>
          <div>
            <div class="card-title">${cc.name}</div>
            <div class="card-subtitle">${cc.host} &bull; ${statusLabel(cc)}</div>
          </div>
        </div>
        <div class="now-casting">
          <div class="label">En pantalla</div>
          ${currentContent(cc)}
        </div>
        <div>
          ${cc.rotating
            ? `<button class="btn btn-stop" onclick="stopRotation('${cc.id}')">&#9632; Detener rotacion</button>`
            : `<button class="btn btn-start" ${!cc.connected ? 'disabled' : ''} onclick="startRotation('${cc.id}')">&#9654; Iniciar rotacion</button>`
          }
        </div>
      </div>
    `).join('');
  }

  function statusLabel(cc) {
    if (!cc.connected) {
      return cc.last_error ? `Desconectado (${cc.last_error})` : 'Desconectado';
    }
    if (!cc.display_ready && (cc.display_launched || cc.rotating || cc.reconnect_attempts > 0)) {
      return cc.last_error || 'Reconectando';
    }
    return 'Conectado';
  }

  function currentContent(cc) {
    if (cc.current_label) {
      return `<div class="title">${cc.current_label}</div><div class="url">${cc.current_url}</div>`;
    }

    return `<div class="url" style="color:#475569">—</div>`;
  }

  function renderLinks() {
    const ccs = state.chromecasts;
    const el = document.getElementById('linksList');
    el.innerHTML = state.links.map((link, i) => `
      <div class="link-row">
        <div class="link-info">
          <div class="name">${link.label}</div>
          <div class="href">${link.url}</div>
        </div>
        <div class="link-actions">
          ${ccs.map(cc => `
            <button class="btn btn-cast" title="Castear a ${cc.name}"
              ${!cc.connected ? 'disabled' : ''}
              onclick="castUrl('${cc.id}', ${i})">
              ${cc.name.replace('ITU ', '').replace('ITU_', '')}
            </button>
          `).join('')}
        </div>
      </div>
    `).join('');
  }

  async function startRotation(ccId) {
    await fetch(`/api/chromecasts/${ccId}/start`, { method: 'POST' });
    fetchStatus();
  }

  async function stopRotation(ccId) {
    await fetch(`/api/chromecasts/${ccId}/stop`, { method: 'POST' });
    fetchStatus();
  }

  async function castUrl(ccId, linkIndex) {
    const link = state.links[linkIndex];
    await fetch(`/api/chromecasts/${ccId}/cast`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: link.url, label: link.label })
    });
    fetchStatus();
  }

  const slider = document.getElementById('slider');
  slider.addEventListener('input', e => {
    sliderActive = true;
    document.getElementById('sliderVal').textContent = e.target.value;
  });
  slider.addEventListener('change', () => { sliderActive = false; });

  async function applyInterval() {
    const seconds = parseFloat(slider.value);
    await fetch('/api/config/interval', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ seconds })
    });
    await fetchStatus();
    sliderActive = false;
  }

  fetchStatus();
  setInterval(fetchStatus, 5000);
</script>
</body>
</html>
