<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiosco</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 24px;
      min-height: 100vh;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; color: #f8fafc; }
    .subtitle { font-size: 0.8rem; color: #64748b; margin-bottom: 22px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 20px;
      margin-bottom: 28px;
    }

    .card, .panel {
      background: #1e293b;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #334155;
    }
    .panel { margin-bottom: 20px; }
    .panel h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 14px;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .card-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #64748b; flex-shrink: 0; margin-top: 5px; }
    .dot.ok { background: #22c55e; }
    .dot.atencion { background: #f59e0b; }
    .dot.error { background: #ef4444; }
    .card-title { font-weight: 600; font-size: 1rem; }
    .card-subtitle { font-size: 0.75rem; color: #64748b; margin-top: 2px; }
    .card-header .spacer { flex: 1; }

    /* --- Espejo en vivo de la pantalla --- */
    .mirror { margin-bottom: 14px; }
    .stage {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #000;
      border: 1px solid #334155;
      border-radius: 8px;
    }
    .stage > .stage-frame {
      position: absolute;
      top: 0; left: 0;
      border: none;
      transform-origin: top left;
      /* El espejo se mira, no se opera: los clics no llegan a la pagina espejada. */
      pointer-events: none;
      background: #000;
    }
    .stage-empty {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px;
      font-size: 0.78rem;
      color: #64748b;
      line-height: 1.5;
    }
    .stage-badge {
      position: absolute;
      top: 6px; right: 6px;
      z-index: 2;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid #334155;
      color: #94a3b8;
      font-size: 0.62rem;
      padding: 2px 7px;
      border-radius: 999px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .mirror-bar {
      height: 3px;
      background: #0f172a;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }
    .mirror-bar > div { height: 100%; width: 0; background: #3b82f6; transition: width 0.9s linear; }
    .mirror-caption {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.72rem;
      color: #94a3b8;
      margin-top: 6px;
    }
    .mirror-caption .label { color: #f1f5f9; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mirror-caption .countdown { flex-shrink: 0; color: #64748b; }

    .diagnosis {
      background: #0f172a;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
      border-left: 3px solid #64748b;
    }
    .diagnosis.ok { border-left-color: #22c55e; }
    .diagnosis.atencion { border-left-color: #f59e0b; }
    .diagnosis.error { border-left-color: #ef4444; }
    .diagnosis .summary { font-weight: 600; font-size: 0.85rem; color: #f1f5f9; }
    .diagnosis .cause { font-size: 0.75rem; color: #94a3b8; margin-top: 6px; line-height: 1.45; }
    .diagnosis .action { font-size: 0.75rem; color: #7dd3fc; margin-top: 6px; line-height: 1.45; }

    .btn-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 13px;
      border-radius: 8px;
      border: none;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s;
    }
    .btn:hover:not(:disabled) { opacity: 0.85; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-start { background: #22c55e; color: #052e16; }
    .btn-stop { background: #ef4444; color: #fff; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-ghost { background: #334155; color: #cbd5e1; }
    .btn-danger-ghost { background: #334155; color: #fca5a5; }
    .btn-sm { padding: 4px 9px; font-size: 0.72rem; }

    .playlist-box { margin-top: 14px; border-top: 1px solid #334155; padding-top: 12px; }
    .playlist-summary { font-size: 0.75rem; color: #94a3b8; margin-bottom: 8px; }
    .playlist-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      font-size: 0.8rem;
    }
    .playlist-item input[type=checkbox] { accent-color: #3b82f6; width: 15px; height: 15px; cursor: pointer; }
    .playlist-item .pl-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .playlist-item.off .pl-label { color: #64748b; }
    .playlist-actions { display: flex; gap: 6px; margin-top: 10px; }

    .link-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #283548;
    }
    .link-row:last-child { border-bottom: none; }
    .link-row.disabled .name, .link-row.disabled .href { opacity: 0.45; }
    .link-order { display: flex; flex-direction: column; gap: 2px; }
    .link-order button {
      background: #334155; color: #94a3b8; border: none; border-radius: 4px;
      width: 22px; height: 16px; font-size: 0.6rem; cursor: pointer; line-height: 1; font-family: inherit;
    }
    .link-order button:disabled { opacity: 0.3; cursor: not-allowed; }
    .link-info { flex: 1; min-width: 0; }
    .link-info .name { font-weight: 500; font-size: 0.875rem; }
    .link-info .href { font-size: 0.7rem; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badges { display: flex; gap: 5px; margin-top: 4px; flex-wrap: wrap; }
    .badge {
      font-size: 0.62rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #0f172a;
      color: #94a3b8;
      border: 1px solid #334155;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .badge.gif { color: #c4b5fd; border-color: #4c1d95; }
    .badge.live { color: #6ee7b7; border-color: #065f46; }
    .badge.off { color: #fca5a5; border-color: #7f1d1d; }
    .link-actions { display: flex; gap: 5px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; max-width: 340px; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }
    .field label { display: block; font-size: 0.7rem; color: #94a3b8; margin-bottom: 4px; }
    .field input[type=text], .field input[type=number], .field select {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 7px 10px;
      color: #e2e8f0;
      font-size: 0.82rem;
      font-family: inherit;
    }
    .field input:focus, .field select:focus { outline: none; border-color: #3b82f6; }
    .checks { display: flex; gap: 16px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .checks label { font-size: 0.78rem; color: #cbd5e1; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .checks input[type=checkbox] { accent-color: #3b82f6; width: 15px; height: 15px; cursor: pointer; }
    .form-box { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 14px; margin-bottom: 14px; }
    .form-hint { font-size: 0.7rem; color: #64748b; margin-bottom: 12px; line-height: 1.5; }

    .interval-bar {
      background: #1e293b;
      border-radius: 12px;
      padding: 18px 20px;
      border: 1px solid #334155;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .interval-bar label { font-size: 0.875rem; font-weight: 500; color: #94a3b8; white-space: nowrap; }
    .interval-bar input[type=range] { flex: 1; min-width: 120px; accent-color: #3b82f6; }
    .interval-val {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.875rem;
      font-weight: 600;
      color: #f1f5f9;
      min-width: 60px;
      text-align: center;
    }

    /* --- Modal de ajuste visual --- */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 80;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      width: min(880px, 100%);
      max-height: 100%;
      overflow: auto;
      padding: 20px;
    }
    .modal-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
    .modal-head .grow { flex: 1; min-width: 0; }
    .modal-title { font-size: 1rem; font-weight: 600; color: #f8fafc; }
    .modal-url { font-size: 0.7rem; color: #64748b; word-break: break-all; margin-top: 2px; }
    .zoom-views { display: flex; gap: 6px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
    .zoom-views .hint { font-size: 0.72rem; color: #64748b; }
    .btn-toggle-on { background: #1d4ed8; color: #fff; }
    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .zoom-controls input[type=range] { flex: 1; min-width: 160px; accent-color: #3b82f6; }
    .zoom-presets { display: flex; gap: 4px; }
    .zoom-meta { font-size: 0.72rem; color: #64748b; margin-top: 10px; line-height: 1.5; }
    .zoom-note {
      background: #0f172a;
      border-left: 3px solid #f59e0b;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.73rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-top: 12px;
    }
    .modal-foot { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; align-items: center; }
    .modal-foot .spacer { flex: 1; }

    #toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 90;
      max-width: 420px;
    }
    .toast {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.8rem;
      line-height: 1.45;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    .toast.err { background: #7f1d1d; color: #fee2e2; border: 1px solid #b91c1c; }
    .toast.ok { background: #14532d; color: #dcfce7; border: 1px solid #16a34a; }
    .empty { font-size: 0.8rem; color: #64748b; padding: 10px 0; }
  </style>
</head>
<body>

<h1>Quiosco</h1>
<div class="subtitle">Consola de pantallas. Los cambios se guardan en config.json y se aplican sin reiniciar.</div>

<div class="interval-bar">
  <label>Intervalo de rotacion</label>
  <input type="range" id="slider" min="5" max="300" step="5" value="15">
  <span class="interval-val"><span id="sliderVal">15</span>s</span>
  <button class="btn btn-primary" onclick="applyInterval()">Aplicar</button>
  <a class="btn btn-ghost" href="/cast/startup-check" target="_blank" rel="noopener noreferrer"
     style="text-decoration:none">Debug interno</a>
</div>

<div class="grid" id="chromecasts"></div>

<div class="panel">
  <h2>
    Links
    <button class="btn btn-primary btn-sm" onclick="toggleAddForm()">+ Agregar link</button>
  </h2>
  <div id="addForm"></div>
  <div id="linksList"></div>
</div>

<div class="modal-backdrop" id="zoomModal" onclick="if (event.target === this) closeZoom()">
  <div class="modal">
    <div class="modal-head">
      <div class="grow">
        <div class="modal-title" id="zoomTitle"></div>
        <div class="modal-url" id="zoomUrl"></div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="closeZoom()">Cerrar</button>
    </div>
    <div class="zoom-views" id="zoomViews"></div>
    <div class="stage" id="zoomStage"></div>
    <div class="zoom-controls">
      <label style="font-size:0.8rem; color:#94a3b8">Zoom</label>
      <input type="range" id="zoomRange" min="0.3" max="2" step="0.05" value="1">
      <span class="interval-val" id="zoomVal">1.00</span>
      <div class="zoom-presets" id="zoomPresets"></div>
    </div>
    <div class="zoom-meta" id="zoomMeta"></div>
    <div id="zoomNote"></div>
    <div class="modal-foot">
      <div class="field" id="zoomScreenField" style="min-width:200px"></div>
      <div class="spacer"></div>
      <button class="btn btn-ghost" onclick="closeZoom()">Cancelar</button>
      <button class="btn btn-primary" id="zoomSaveBtn" onclick="saveZoom()">Guardar zoom</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  let state = { chromecasts: [], links: [], interval_seconds: 15, config_revision: 0 };
  let sliderActive = false;
  let editingLinkId = null;   // link cuyo formulario esta abierto
  let addingLink = false;
  let playlistDraft = {};     // cc_id -> array de link ids sin aplicar todavia
  let cardsKey = '';          // firma de las tarjetas dibujadas: solo se reconstruyen si cambia
  let mirrorPrefs = loadMirrorPrefs();   // cc_id -> bool (mostrar el espejo)
  let slotClock = {};         // cc_id -> {seconds, at} para animar la barra entre polls
  let zoomEditor = null;      // {linkId, ccId, value, previewSrc, mode} mientras el modal esta abierto

  // Un solo observer reescala todos los "stage": el frame se dibuja al tamano
  // real del viewport y se encoge por transform, igual que en la display page.
  const stageObserver = new ResizeObserver(entries => {
    for (const entry of entries) scaleStage(entry.target);
  });

  function esc(value) {
    return String(value === null || value === undefined ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function formOpen() {
    return editingLinkId !== null || addingLink || Object.keys(playlistDraft).length > 0;
  }

  function toast(message, kind) {
    const el = document.createElement('div');
    el.className = 'toast ' + (kind || 'ok');
    el.textContent = message;
    document.getElementById('toast').appendChild(el);
    setTimeout(() => el.remove(), kind === 'err' ? 8000 : 3500);
  }

  async function api(method, path, body) {
    const options = { method };
    if (body !== undefined) {
      options.headers = { 'Content-Type': 'application/json' };
      options.body = JSON.stringify(body);
    }
    const res = await fetch(path, options);
    let payload = null;
    try { payload = await res.json(); } catch (e) { /* respuesta sin cuerpo */ }
    if (!res.ok) {
      const detail = (payload && payload.detail) || ('Error ' + res.status);
      toast(typeof detail === 'string' ? detail : JSON.stringify(detail), 'err');
      throw new Error(detail);
    }
    return payload;
  }

  async function fetchStatus() {
    try {
      const res = await fetch('/api/status');
      state = await res.json();
      render();
    } catch (e) { console.error(e); }
  }

  function render() {
    syncScreens();
    if (!formOpen()) {
      renderAddForm();
      renderLinks();
    }
    refreshZoomAsset();
    if (!sliderActive) {
      document.getElementById('slider').value = state.interval_seconds;
      document.getElementById('sliderVal').textContent = state.interval_seconds;
    }
  }

  // --- Escalado de previews ---

  // El frame vive a tamano de viewport real y se encoge hasta la caja: misma
  // matematica que /cast/display, asi que el preview es lo que se va a ver.
  function scaleStage(stage) {
    const frame = stage.querySelector('.stage-frame');
    if (!frame) return;
    const vw = parseFloat(frame.dataset.vw);
    const vh = parseFloat(frame.dataset.vh);
    const box = stage.getBoundingClientRect();
    if (!vw || !vh || !box.width) return;
    frame.style.transform = `scale(${box.width / vw}, ${box.height / vh})`;
  }

  function sizeStageFrame(stage, frame, vw, vh, aspectW, aspectH) {
    stage.style.aspectRatio = `${aspectW} / ${aspectH}`;
    frame.dataset.vw = vw;
    frame.dataset.vh = vh;
    frame.style.width = vw + 'px';
    frame.style.height = vh + 'px';
    scaleStage(stage);
  }

  // --- Pantallas ---

  function loadMirrorPrefs() {
    try { return JSON.parse(localStorage.getItem('quiosco.mirrors')) || {}; }
    catch (e) { return {}; }
  }

  function mirrorOn(ccId) {
    return mirrorPrefs[ccId] !== false;   // por defecto encendido
  }

  function saveMirrorPrefs() {
    try { localStorage.setItem('quiosco.mirrors', JSON.stringify(mirrorPrefs)); }
    catch (e) { /* modo privado: la preferencia dura lo que la pestana */ }
  }

  function syncScreens() {
    const key = state.chromecasts.map(cc => cc.id + ':' + (cc.resolution || []).join('x')).join('|');
    if (key !== cardsKey) {
      cardsKey = key;
      buildScreenCards();
    }
    state.chromecasts.forEach(updateScreenCard);
  }

  // Las tarjetas se construyen una sola vez: el espejo es un iframe y volver a
  // pintar el HTML cada 5s lo recargaria sin parar.
  function buildScreenCards() {
    const el = document.getElementById('chromecasts');
    el.innerHTML = state.chromecasts.map(cc => {
      const [w, h] = cc.resolution || [1280, 720];
      return `
      <div class="card" id="card-${esc(cc.id)}">
        <div class="card-header">
          <div class="dot" data-role="dot"></div>
          <div>
            <div class="card-title">${esc(cc.name)}</div>
            <div class="card-subtitle">${esc(cc.host)} &bull; ${esc(cc.id)} &bull; ${w}x${h}</div>
          </div>
          <div class="spacer"></div>
          <button class="btn btn-ghost btn-sm" data-role="mirror-toggle"
            onclick="toggleMirror('${esc(cc.id)}')"></button>
        </div>

        <div class="mirror">
          <div class="stage" data-role="stage">
            <div class="stage-empty" data-role="stage-empty"></div>
            <div class="stage-badge">Espejo</div>
          </div>
          <div class="mirror-bar"><div data-role="progress"></div></div>
          <div class="mirror-caption">
            <span class="label" data-role="caption-label">&mdash;</span>
            <span class="countdown" data-role="caption-countdown"></span>
          </div>
        </div>

        <div class="diagnosis" data-role="diag"></div>
        <div class="btn-row" data-role="btns"></div>
        <div data-role="playlist"></div>
      </div>`;
    }).join('');

    state.chromecasts.forEach(cc => {
      const stage = document.querySelector(`#card-${CSS.escape(cc.id)} [data-role=stage]`);
      const [w, h] = cc.resolution || [1280, 720];
      stage.style.aspectRatio = `${w} / ${h}`;
      stageObserver.observe(stage);
      applyMirror(cc.id);
    });
  }

  function applyMirror(ccId) {
    const card = document.getElementById('card-' + ccId);
    if (!card) return;
    const cc = state.chromecasts.find(c => c.id === ccId);
    const stage = card.querySelector('[data-role=stage]');
    const empty = card.querySelector('[data-role=stage-empty]');
    const toggle = card.querySelector('[data-role=mirror-toggle]');
    const existing = stage.querySelector('.stage-frame');
    const wanted = mirrorOn(ccId) && !document.hidden;

    toggle.textContent = mirrorOn(ccId) ? 'Ocultar espejo' : 'Ver espejo';

    if (!wanted) {
      if (existing) existing.remove();
      empty.style.display = 'flex';
      empty.textContent = mirrorOn(ccId)
        ? 'Espejo en pausa mientras la pestana esta en segundo plano'
        : 'Espejo apagado';
      return;
    }
    if (existing) return;

    const [w, h] = (cc && cc.resolution) || [1280, 720];
    const frame = document.createElement('iframe');
    frame.className = 'stage-frame';
    // preview=1: este poll NO cuenta como heartbeat del watchdog, para que una
    // pestana abierta aca no haga pasar por viva una pantalla muerta.
    frame.src = `/cast/display?cc_id=${encodeURIComponent(ccId)}&preview=1`;
    frame.setAttribute('scrolling', 'no');
    stage.appendChild(frame);
    sizeStageFrame(stage, frame, w, h, w, h);
    empty.style.display = 'none';
  }

  function toggleMirror(ccId) {
    mirrorPrefs[ccId] = !mirrorOn(ccId);
    saveMirrorPrefs();
    applyMirror(ccId);
  }

  function updateScreenCard(cc) {
    const card = document.getElementById('card-' + cc.id);
    if (!card) return;
    const h = cc.health || { level: '', summary: '', cause: '', action: '' };
    const hasLinks = (cc.playlist_link_ids || []).length > 0;

    card.querySelector('[data-role=dot]').className = 'dot ' + (h.level || '');

    const diag = card.querySelector('[data-role=diag]');
    diag.className = 'diagnosis ' + (h.level || '');
    diag.innerHTML = `
      <div class="summary">${esc(h.summary)}</div>
      ${h.cause ? `<div class="cause">${esc(h.cause)}</div>` : ''}
      ${h.action ? `<div class="action">${esc(h.action)}</div>` : ''}`;

    const captionLabel = card.querySelector('[data-role=caption-label]');
    captionLabel.textContent = cc.current_label || '—';
    captionLabel.title = cc.current_url || '';

    // El reloj del slot se resincroniza en cada poll y se interpola entre polls.
    if (cc.rotating && cc.seconds_on_current !== null && cc.seconds_on_current !== undefined) {
      slotClock[cc.id] = { seconds: cc.seconds_on_current, at: Date.now() };
    } else {
      delete slotClock[cc.id];
    }
    tickSlot(cc.id);

    card.querySelector('[data-role=btns]').innerHTML = `
      ${cc.rotating
        ? `<button class="btn btn-stop" onclick="act('/api/chromecasts/${esc(cc.id)}/stop','POST')">&#9632; Detener</button>`
        : `<button class="btn btn-start" ${!cc.connected || !hasLinks ? 'disabled' : ''}
             onclick="act('/api/chromecasts/${esc(cc.id)}/start','POST')">&#9654; Iniciar rotacion</button>`}
      <button class="btn btn-ghost" ${!hasLinks ? 'disabled' : ''}
        onclick="skip('${esc(cc.id)}',-1)" title="Link anterior">&#9664;</button>
      <button class="btn btn-ghost" ${!hasLinks ? 'disabled' : ''}
        onclick="skip('${esc(cc.id)}',1)" title="Link siguiente">&#9654;</button>
      <button class="btn btn-ghost" ${!cc.connected ? 'disabled' : ''}
        onclick="act('/api/chromecasts/${esc(cc.id)}/relaunch','POST','Pantalla relanzada')"
        title="Recargar la display page en el Chromecast">&#8635; Relanzar</button>
      <a class="btn btn-ghost" style="text-decoration:none" target="_blank" rel="noopener noreferrer"
        href="/cast/display?cc_id=${esc(cc.id)}&preview=1"
        title="Abrir el espejo en tamano completo">&#9974; Ampliar</a>`;

    const playlistSlot = card.querySelector('[data-role=playlist]');
    if (!formOpen() || !playlistSlot.innerHTML.trim()) {
      playlistSlot.innerHTML = renderPlaylistBox(cc);
    }
  }

  // Barra y cuenta regresiva del slot actual, una vez por segundo.
  function tickSlot(ccId) {
    const card = document.getElementById('card-' + ccId);
    if (!card) return;
    const bar = card.querySelector('[data-role=progress]');
    const countdown = card.querySelector('[data-role=caption-countdown]');
    const clock = slotClock[ccId];
    if (!clock) {
      bar.style.width = '0';
      countdown.textContent = 'sin rotacion';
      return;
    }
    const interval = state.interval_seconds || 1;
    const elapsed = clock.seconds + (Date.now() - clock.at) / 1000;
    const left = Math.max(0, Math.round(interval - elapsed));
    bar.style.width = Math.min(100, (elapsed / interval) * 100) + '%';
    countdown.textContent = 'cambia en ' + left + 's';
  }

  function renderPlaylistBox(cc) {
    const draft = playlistDraft[cc.id];
    const open = draft !== undefined;
    if (!open) {
      const label = cc.playlist === null
        ? `Todos los links (${(cc.playlist_link_ids || []).length})`
        : `Seleccion propia: ${(cc.playlist_link_ids || []).length} de ${state.links.length}`;
      return `
        <div class="playlist-box">
          <div class="playlist-summary">Que muestra esta pantalla: <strong>${esc(label)}</strong></div>
          <button class="btn btn-ghost btn-sm" onclick="openPlaylist('${esc(cc.id)}')">Elegir links</button>
        </div>`;
    }

    // En modo edicion se listan primero los elegidos, en su orden, y luego el resto.
    const chosen = draft.filter(id => state.links.some(l => l.id === id));
    const rest = state.links.filter(l => !chosen.includes(l.id)).map(l => l.id);
    const rows = chosen.concat(rest).map(id => {
      const link = state.links.find(l => l.id === id);
      const on = chosen.includes(id);
      const position = chosen.indexOf(id);
      return `
        <div class="playlist-item ${on ? '' : 'off'}">
          <input type="checkbox" ${on ? 'checked' : ''}
            onchange="togglePlaylistItem('${esc(cc.id)}','${esc(id)}')">
          <span class="pl-label">${esc(link.label)}${link.enabled ? '' : ' (deshabilitado)'}</span>
          ${on ? `
            <button class="btn btn-ghost btn-sm" ${position === 0 ? 'disabled' : ''}
              onclick="movePlaylistItem('${esc(cc.id)}','${esc(id)}',-1)">&#9650;</button>
            <button class="btn btn-ghost btn-sm" ${position === chosen.length - 1 ? 'disabled' : ''}
              onclick="movePlaylistItem('${esc(cc.id)}','${esc(id)}',1)">&#9660;</button>` : ''}
        </div>`;
    }).join('');

    return `
      <div class="playlist-box">
        <div class="playlist-summary">Elegi los links de esta pantalla y su orden:</div>
        ${rows}
        <div class="playlist-actions">
          <button class="btn btn-primary btn-sm" onclick="savePlaylist('${esc(cc.id)}')">Aplicar</button>
          <button class="btn btn-ghost btn-sm" onclick="usePlaylistAll('${esc(cc.id)}')">Usar todos</button>
          <button class="btn btn-ghost btn-sm" onclick="cancelPlaylist('${esc(cc.id)}')">Cancelar</button>
        </div>
      </div>`;
  }

  function repaintPlaylist(ccId) {
    const card = document.getElementById('card-' + ccId);
    const cc = state.chromecasts.find(c => c.id === ccId);
    if (card && cc) card.querySelector('[data-role=playlist]').innerHTML = renderPlaylistBox(cc);
  }

  function openPlaylist(ccId) {
    const cc = state.chromecasts.find(c => c.id === ccId);
    playlistDraft[ccId] = (cc.playlist === null ? state.links.map(l => l.id) : cc.playlist).slice();
    repaintPlaylist(ccId);
  }

  function cancelPlaylist(ccId) {
    delete playlistDraft[ccId];
    render();
  }

  function togglePlaylistItem(ccId, linkId) {
    const draft = playlistDraft[ccId];
    const at = draft.indexOf(linkId);
    if (at === -1) draft.push(linkId); else draft.splice(at, 1);
    repaintPlaylist(ccId);
  }

  function movePlaylistItem(ccId, linkId, delta) {
    const draft = playlistDraft[ccId];
    const at = draft.indexOf(linkId);
    const to = at + delta;
    if (at === -1 || to < 0 || to >= draft.length) return;
    draft.splice(to, 0, draft.splice(at, 1)[0]);
    repaintPlaylist(ccId);
  }

  function usePlaylistAll(ccId) {
    delete playlistDraft[ccId];
    api('PUT', `/api/chromecasts/${ccId}/playlist`, { link_ids: null })
      .then(() => { toast('La pantalla vuelve a mostrar todos los links'); fetchStatus(); })
      .catch(() => fetchStatus());
  }

  function savePlaylist(ccId) {
    const draft = playlistDraft[ccId];
    if (draft.length === 0 && !confirm('Esta pantalla quedara sin links que mostrar. ¿Continuar?')) return;
    delete playlistDraft[ccId];
    api('PUT', `/api/chromecasts/${ccId}/playlist`, { link_ids: draft })
      .then(() => { toast('Playlist actualizada'); fetchStatus(); })
      .catch(() => fetchStatus());
  }

  async function act(path, method, okMessage) {
    try {
      await api(method, path);
      if (okMessage) toast(okMessage);
    } catch (e) { /* el toast ya lo informo */ }
    fetchStatus();
  }

  async function skip(ccId, step) {
    try {
      const res = await api('POST', `/api/chromecasts/${ccId}/skip`, { step });
      if (res && res.current_label) toast('Ahora: ' + res.current_label);
    } catch (e) { /* ya informado */ }
    fetchStatus();
  }

  // --- Links ---

  function renderLinks() {
    const el = document.getElementById('linksList');
    if (state.links.length === 0) {
      el.innerHTML = '<div class="empty">No hay links configurados. Agrega el primero con el boton de arriba.</div>';
      return;
    }
    el.innerHTML = state.links.map((link, i) => {
      if (link.id === editingLinkId) return linkForm(link);
      return `
      <div class="link-row ${link.enabled ? '' : 'disabled'}">
        <div class="link-order">
          <button ${i === 0 ? 'disabled' : ''} onclick="moveLink('${esc(link.id)}',-1)" title="Subir">&#9650;</button>
          <button ${i === state.links.length - 1 ? 'disabled' : ''} onclick="moveLink('${esc(link.id)}',1)" title="Bajar">&#9660;</button>
        </div>
        <div class="link-info">
          <div class="name">${esc(link.label)}</div>
          <div class="href">${esc(link.url)}</div>
          <div class="badges">
            ${link.enabled ? '' : '<span class="badge off">Deshabilitado</span>'}
            ${link.zoom !== 1 ? `<span class="badge">zoom ${esc(link.zoom)}</span>` : ''}
            ${link.optional ? '<span class="badge">Opcional</span>' : ''}
            ${link.direct ? '<span class="badge">Directo</span>' : ''}
            ${isLive(link) ? '<span class="badge live">En vivo</span>' : ''}
            ${!isLive(link) && usesGif(link) ? '<span class="badge gif">GIF</span>' : ''}
          </div>
        </div>
        <div class="link-actions">
          <button class="btn btn-primary btn-sm" onclick="openZoom('${esc(link.id)}')"
            title="Ver como entra en pantalla y ajustar el zoom">&#9635; Ajustar</button>
          ${state.chromecasts.map(cc => `
            <button class="btn btn-ghost btn-sm" title="Castear a ${esc(cc.name)} ahora"
              ${!cc.connected ? 'disabled' : ''}
              onclick="castLink('${esc(cc.id)}','${esc(link.id)}')">
              &#9654; ${esc(shortName(cc.name))}
            </button>`).join('')}
          <button class="btn btn-ghost btn-sm" onclick="toggleEnabled('${esc(link.id)}',${!link.enabled})">
            ${link.enabled ? 'Deshabilitar' : 'Habilitar'}
          </button>
          ${!isLive(link) && usesGif(link)
            ? `<button class="btn btn-ghost btn-sm" onclick="recapture('${esc(link.id)}')"
                 title="Recapturar el GIF ahora, sin esperar el ciclo de 5 min">&#8635; GIF</button>`
            : ''}
          <button class="btn btn-ghost btn-sm" onclick="editLink('${esc(link.id)}')">Editar</button>
          <button class="btn btn-danger-ghost btn-sm" onclick="deleteLink('${esc(link.id)}')">Borrar</button>
        </div>
      </div>`;
    }).join('');
  }

  // El backend ya dice como se renderiza cada link (preview_mode); la consola
  // no vuelve a adivinar por dominio.
  function usesGif(link) {
    return link.preview_mode === 'screenshot' && !isLive(link);
  }

  function isLive(link) {
    return link && link.render_mode === 'live_screenshot';
  }

  // Los botones de castear repiten el nombre de cada pantalla en cada fila de
  // link, asi que se queda lo que la distingue: "ITUChromecast 4 Sotano" ->
  // "4 Sotano", "ITU_Chromecast 1" -> "1".
  function shortName(name) {
    const short = String(name).replace(/^ITU[\s_]*chromecast[\s_]*/i, '').trim();
    return short || String(name);
  }

  function linkForm(link) {
    const l = link || { id: '', url: '', label: '', zoom: 1, optional: false, direct: false, enabled: true, render_mode: 'iframe' };
    const isNew = !link;
    const prefix = isNew ? 'new' : 'edit';
    return `
      <div class="form-box">
        <div class="form-grid">
          <div class="field" style="grid-column: 1 / -1">
            <label>URL</label>
            <input type="text" id="${prefix}-url" value="${esc(l.url)}" placeholder="https://...">
          </div>
          <div class="field">
            <label>Nombre</label>
            <input type="text" id="${prefix}-label" value="${esc(l.label)}" placeholder="Como se llama esta pantalla">
          </div>
          <div class="field">
            <label>Zoom (0.1 a 4)</label>
            <input type="number" id="${prefix}-zoom" value="${esc(l.zoom)}" step="0.1" min="0.1" max="4">
          </div>
          <div class="field">
            <label>Como se muestra</label>
            <select id="${prefix}-render-mode">
              <option value="iframe" ${isLive(l) ? '' : 'selected'}>Pagina embebida</option>
              <option value="live_screenshot" ${isLive(l) ? 'selected' : ''}>Captura en vivo</option>
            </select>
          </div>
        </div>
        <div class="checks">
          <label><input type="checkbox" id="${prefix}-optional" ${l.optional ? 'checked' : ''}> Opcional</label>
          <label><input type="checkbox" id="${prefix}-direct" ${l.direct ? 'checked' : ''}> Directo</label>
          <label><input type="checkbox" id="${prefix}-enabled" ${l.enabled ? 'checked' : ''}> Habilitado</label>
        </div>
        <div class="form-hint">
          <strong>Opcional</strong>: si no responde se salta en la rotacion en vez de mostrar un error.
          <strong>Directo</strong>: se carga sin pasar por el proxy, para apps de la misma red que los Chromecasts.
          <strong>Zoom</strong> menor a 1 muestra mas contenido en pantalla; el boton Ajustar deja verlo antes de guardar.
          <strong>Captura en vivo</strong>: para paginas que no se dejan embeber; se publica un PNG
          que se refresca cada pocos segundos. Al pasar un link a este modo hay que reiniciar el
          servicio para que arranque su captura.
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="${isNew ? 'submitNewLink()' : `saveLink('${esc(l.id)}')`}">Guardar</button>
          <button class="btn btn-ghost" onclick="${isNew ? 'toggleAddForm()' : 'cancelEdit()'}">Cancelar</button>
        </div>
      </div>`;
  }

  function readForm(prefix) {
    return {
      url: document.getElementById(prefix + '-url').value.trim(),
      label: document.getElementById(prefix + '-label').value.trim(),
      zoom: parseFloat(document.getElementById(prefix + '-zoom').value),
      optional: document.getElementById(prefix + '-optional').checked,
      direct: document.getElementById(prefix + '-direct').checked,
      enabled: document.getElementById(prefix + '-enabled').checked,
      render_mode: document.getElementById(prefix + '-render-mode').value
    };
  }

  function renderAddForm() {
    document.getElementById('addForm').innerHTML = addingLink ? linkForm(null) : '';
  }

  function toggleAddForm() {
    addingLink = !addingLink;
    editingLinkId = null;
    renderAddForm();
    renderLinks();
  }

  function editLink(linkId) {
    editingLinkId = linkId;
    addingLink = false;
    renderAddForm();
    renderLinks();
  }

  function cancelEdit() {
    editingLinkId = null;
    render();
  }

  async function submitNewLink() {
    const payload = readForm('new');
    try {
      await api('POST', '/api/links', payload);
      addingLink = false;
      toast('Link agregado');
    } catch (e) { return; }  // el formulario queda abierto con lo escrito
    await fetchStatus();
  }

  async function saveLink(linkId) {
    const payload = readForm('edit');
    try {
      await api('PATCH', '/api/links/' + linkId, payload);
      editingLinkId = null;
      toast('Link actualizado');
    } catch (e) { return; }
    await fetchStatus();
  }

  async function toggleEnabled(linkId, enabled) {
    try {
      await api('PATCH', '/api/links/' + linkId, { enabled });
      toast(enabled ? 'Link habilitado' : 'Link deshabilitado: se saca de todas las pantallas');
    } catch (e) { /* ya informado */ }
    fetchStatus();
  }

  async function deleteLink(linkId) {
    const link = state.links.find(l => l.id === linkId);
    if (!confirm(`¿Borrar "${link ? link.label : linkId}"? Tambien se quita de las playlists.`)) return;
    try {
      await api('DELETE', '/api/links/' + linkId);
      toast('Link borrado');
    } catch (e) { /* ya informado */ }
    fetchStatus();
  }

  async function moveLink(linkId, delta) {
    const ids = state.links.map(l => l.id);
    const at = ids.indexOf(linkId);
    const to = at + delta;
    if (at === -1 || to < 0 || to >= ids.length) return;
    ids.splice(to, 0, ids.splice(at, 1)[0]);
    try {
      await api('PUT', '/api/links/order', { link_ids: ids });
    } catch (e) { /* ya informado */ }
    fetchStatus();
  }

  async function recapture(linkId) {
    try {
      await api('POST', `/api/links/${linkId}/recapture`);
      toast('Recaptura encolada. El GIF tarda unos segundos en actualizarse.');
    } catch (e) { /* ya informado */ }
  }

  async function castLink(ccId, linkId) {
    const link = state.links.find(l => l.id === linkId);
    if (!link) return;
    try {
      await api('POST', `/api/chromecasts/${ccId}/cast`, { url: link.url, label: link.label });
      toast('Casteado: ' + link.label);
    } catch (e) { /* ya informado */ }
    fetchStatus();
  }

  // --- Ajuste visual del zoom ---

  const ZOOM_PRESETS = [0.5, 0.6, 0.75, 0.9, 1, 1.25];

  function openZoom(linkId) {
    const link = state.links.find(l => l.id === linkId);
    if (!link) return;
    const cc = state.chromecasts[0];
    const captured = link.preview_mode === 'screenshot';
    zoomEditor = {
      linkId,
      ccId: cc ? cc.id : null,
      value: Number(link.zoom) || 1,
      captured,
      assetSrc: captured ? link.preview_src : null,
      liveSrc: link.live_preview_src || null,
      // Con la pagina viva disponible el zoom se ve moverse; sobre el asset ya
      // capturado no cambia nada, porque siempre llena la pantalla.
      view: link.live_preview_src ? 'live' : 'asset'
    };

    document.getElementById('zoomTitle').textContent = 'Ajustar: ' + link.label;
    document.getElementById('zoomUrl').textContent = link.url;
    document.getElementById('zoomPresets').innerHTML = ZOOM_PRESETS.map(z =>
      `<button class="btn btn-ghost btn-sm" onclick="setZoom(${z})">${z}</button>`).join('');
    document.getElementById('zoomScreenField').innerHTML = state.chromecasts.length > 1
      ? `<label>Pantalla de referencia</label>
         <select onchange="setZoomScreen(this.value)">
           ${state.chromecasts.map(c => `<option value="${esc(c.id)}">${esc(c.name)} — ${(c.resolution || [1280, 720]).join('x')}</option>`).join('')}
         </select>`
      : '';
    document.getElementById('zoomRange').value = zoomEditor.value;

    buildZoomStage();
    applyZoom();
    document.getElementById('zoomModal').classList.add('open');
  }

  function zoomResolution() {
    const cc = state.chromecasts.find(c => c.id === (zoomEditor && zoomEditor.ccId));
    return (cc && cc.resolution) || [1280, 720];
  }

  // El elemento del preview se crea una vez por vista: mover el slider solo
  // cambia su tamano, para no recargar la pagina embebida en cada paso.
  function buildZoomStage() {
    const stage = document.getElementById('zoomStage');
    stage.innerHTML = '';
    const live = zoomEditor.view === 'live';
    const frame = live ? document.createElement('iframe') : document.createElement('img');
    frame.className = 'stage-frame';
    if (live) {
      frame.setAttribute('scrolling', 'no');
    } else {
      frame.style.objectFit = 'fill';   // igual que en la display page
    }
    frame.src = live ? zoomEditor.liveSrc : zoomEditor.assetSrc;
    stage.appendChild(frame);
    stageObserver.observe(stage);
  }

  function setZoomView(view) {
    if (zoomEditor.view === view) return;
    zoomEditor.view = view;
    buildZoomStage();
    applyZoom();
  }

  function applyZoom() {
    const [w, h] = zoomResolution();
    const zoom = zoomEditor.value;
    const vw = Math.round(w / zoom);
    const vh = Math.round(h / zoom);
    const stage = document.getElementById('zoomStage');
    const frame = stage.querySelector('.stage-frame');
    if (frame) sizeStageFrame(stage, frame, vw, vh, w, h);

    document.getElementById('zoomVal').textContent = zoom.toFixed(2);
    document.getElementById('zoomMeta').textContent =
      `Pantalla ${w}x${h} · la pagina se carga a ${vw}x${vh} y se encoge a ${zoom.toFixed(2)}x. ` +
      `Zoom menor entra mas contenido, con letra mas chica.`;

    const captured = zoomEditor.captured;
    const live = zoomEditor.view === 'live';

    // El selector solo tiene sentido cuando hay dos cosas distintas que mirar.
    document.getElementById('zoomViews').innerHTML = captured && zoomEditor.liveSrc
      ? `<button class="btn btn-sm ${live ? 'btn-toggle-on' : 'btn-ghost'}"
           onclick="setZoomView('live')">Pagina en vivo</button>
         <button class="btn btn-sm ${live ? 'btn-ghost' : 'btn-toggle-on'}"
           onclick="setZoomView('asset')">Captura publicada</button>
         <span class="hint">La pantalla muestra la captura; la pagina viva sirve para encuadrarla.</span>`
      : '';

    let note = '';
    if (captured && live) {
      note = `Esta pagina se muestra en la pantalla como <strong>captura</strong>. Lo que ves aca es
              la pagina viva al mismo viewport con el que se captura, asi que es el encuadre que va
              a tener la <strong>proxima captura</strong>: guarda y recaptura para publicarlo.`;
    } else if (captured) {
      note = `Esta es la captura ya publicada, y ocupa toda la pantalla pase lo que pase: mover el
              zoom no la cambia. El zoom solo define cuanto contenido entra en la
              <strong>proxima captura</strong>.` +
             (zoomEditor.liveSrc ? ' Para verlo moverse, usa <strong>Pagina en vivo</strong>.' : '');
    }
    document.getElementById('zoomNote').innerHTML = note
      ? `<div class="zoom-note">${note}</div>` : '';
    document.getElementById('zoomSaveBtn').textContent = captured
      ? 'Guardar y recapturar' : 'Guardar zoom';
  }

  function setZoom(value) {
    zoomEditor.value = Math.min(4, Math.max(0.1, Number(value)));
    document.getElementById('zoomRange').value = zoomEditor.value;
    applyZoom();
  }

  function setZoomScreen(ccId) {
    zoomEditor.ccId = ccId;
    applyZoom();
  }

  // Tras recapturar, el asset cambia de revision en /api/status: se refresca la
  // imagen sin cerrar el modal.
  function refreshZoomAsset() {
    if (!zoomEditor || !zoomEditor.captured) return;
    const link = state.links.find(l => l.id === zoomEditor.linkId);
    if (!link || link.preview_src === zoomEditor.assetSrc) return;
    zoomEditor.assetSrc = link.preview_src;
    if (zoomEditor.view !== 'asset') return;
    const frame = document.querySelector('#zoomStage .stage-frame');
    if (frame) frame.src = link.preview_src;
  }

  async function saveZoom() {
    const { linkId, value, captured } = zoomEditor;
    try {
      await api('PATCH', '/api/links/' + linkId, { zoom: value });
    } catch (e) { return; }
    if (captured) {
      try {
        await api('POST', `/api/links/${linkId}/recapture`);
        toast('Zoom guardado. Recaptura encolada: el preview se actualiza en unos segundos.');
        // Pasar a la captura: es lo que va a ver la pantalla, y se refresca sola
        // en cuanto el asset nuevo esta listo.
        setZoomView('asset');
      } catch (e) { /* ya informado */ }
    } else {
      closeZoom();
      toast('Zoom guardado. Las pantallas lo toman en el proximo refresco (2s).');
    }
    fetchStatus();
  }

  function closeZoom() {
    zoomEditor = null;
    document.getElementById('zoomModal').classList.remove('open');
    document.getElementById('zoomStage').innerHTML = '';
  }

  document.getElementById('zoomRange').addEventListener('input', e => {
    if (zoomEditor) setZoom(e.target.value);
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && zoomEditor) closeZoom();
  });

  // El espejo avisa cuando cambia de link. Sin esto el pie y la barra van al
  // ritmo del poll de /api/status (5s) y se ven desfasados de lo que ya cambio
  // en la miniatura.
  window.addEventListener('message', event => {
    if (event.origin !== window.location.origin) return;
    const msg = event.data;
    if (!msg || msg.quiosco !== 'current') return;
    const cc = state.chromecasts.find(c => c.id === msg.ccId);
    if (!cc) return;
    const link = state.links.find(l => l.id === msg.linkId);
    cc.current_label = link ? link.label : null;
    cc.current_url = link ? link.url : null;
    if (msg.rotating) slotClock[cc.id] = { seconds: 0, at: Date.now() };
    const card = document.getElementById('card-' + cc.id);
    if (card) {
      const label = card.querySelector('[data-role=caption-label]');
      label.textContent = cc.current_label || '—';
      label.title = cc.current_url || '';
    }
    tickSlot(cc.id);
  });

  // Con la pestana en segundo plano los espejos se sueltan: cada uno arrastra
  // los iframes reales de la rotacion (proxy PRTG incluido).
  document.addEventListener('visibilitychange', () => {
    state.chromecasts.forEach(cc => applyMirror(cc.id));
  });

  // --- Intervalo ---

  const slider = document.getElementById('slider');
  slider.addEventListener('input', e => {
    sliderActive = true;
    document.getElementById('sliderVal').textContent = e.target.value;
  });
  slider.addEventListener('change', () => { sliderActive = false; });

  async function applyInterval() {
    try {
      await api('PUT', '/api/config/interval', { seconds: parseFloat(slider.value) });
      toast('Intervalo guardado');
    } catch (e) { /* ya informado */ }
    sliderActive = false;
    fetchStatus();
  }

  fetchStatus();
  setInterval(fetchStatus, 5000);
  setInterval(() => state.chromecasts.forEach(cc => tickSlot(cc.id)), 1000);
</script>
</body>
</html>
