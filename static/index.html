<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiosco</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 24px;
      min-height: 100vh;
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; color: #f8fafc; }
    .subtitle { font-size: 0.8rem; color: #64748b; margin-bottom: 22px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 20px;
      margin-bottom: 28px;
    }

    .card, .panel {
      background: #1e293b;
      border-radius: 12px;
      padding: 20px;
      border: 1px solid #334155;
    }
    .panel { margin-bottom: 20px; }
    .panel h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 14px;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .card-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 14px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #64748b; flex-shrink: 0; margin-top: 5px; }
    .dot.ok { background: #22c55e; }
    .dot.atencion { background: #f59e0b; }
    .dot.error { background: #ef4444; }
    .card-title { font-weight: 600; font-size: 1rem; }
    .card-subtitle { font-size: 0.75rem; color: #64748b; margin-top: 2px; }

    .diagnosis {
      background: #0f172a;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
      border-left: 3px solid #64748b;
    }
    .diagnosis.ok { border-left-color: #22c55e; }
    .diagnosis.atencion { border-left-color: #f59e0b; }
    .diagnosis.error { border-left-color: #ef4444; }
    .diagnosis .summary { font-weight: 600; font-size: 0.85rem; color: #f1f5f9; }
    .diagnosis .cause { font-size: 0.75rem; color: #94a3b8; margin-top: 6px; line-height: 1.45; }
    .diagnosis .action { font-size: 0.75rem; color: #7dd3fc; margin-top: 6px; line-height: 1.45; }

    .now { font-size: 0.75rem; color: #94a3b8; margin-bottom: 12px; }
    .now .title { color: #f1f5f9; font-weight: 600; font-size: 0.8rem; }
    .now .url { color: #475569; word-break: break-all; }

    .btn-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 13px;
      border-radius: 8px;
      border: none;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s;
    }
    .btn:hover:not(:disabled) { opacity: 0.85; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-start { background: #22c55e; color: #052e16; }
    .btn-stop { background: #ef4444; color: #fff; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-ghost { background: #334155; color: #cbd5e1; }
    .btn-danger-ghost { background: #334155; color: #fca5a5; }
    .btn-sm { padding: 4px 9px; font-size: 0.72rem; }

    .playlist-box { margin-top: 14px; border-top: 1px solid #334155; padding-top: 12px; }
    .playlist-summary { font-size: 0.75rem; color: #94a3b8; margin-bottom: 8px; }
    .playlist-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      font-size: 0.8rem;
    }
    .playlist-item input[type=checkbox] { accent-color: #3b82f6; width: 15px; height: 15px; cursor: pointer; }
    .playlist-item .pl-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .playlist-item.off .pl-label { color: #64748b; }
    .playlist-actions { display: flex; gap: 6px; margin-top: 10px; }

    .link-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #283548;
    }
    .link-row:last-child { border-bottom: none; }
    .link-row.disabled .name, .link-row.disabled .href { opacity: 0.45; }
    .link-order { display: flex; flex-direction: column; gap: 2px; }
    .link-order button {
      background: #334155; color: #94a3b8; border: none; border-radius: 4px;
      width: 22px; height: 16px; font-size: 0.6rem; cursor: pointer; line-height: 1; font-family: inherit;
    }
    .link-order button:disabled { opacity: 0.3; cursor: not-allowed; }
    .link-info { flex: 1; min-width: 0; }
    .link-info .name { font-weight: 500; font-size: 0.875rem; }
    .link-info .href { font-size: 0.7rem; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badges { display: flex; gap: 5px; margin-top: 4px; flex-wrap: wrap; }
    .badge {
      font-size: 0.62rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #0f172a;
      color: #94a3b8;
      border: 1px solid #334155;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .badge.gif { color: #c4b5fd; border-color: #4c1d95; }
    .badge.live { color: #6ee7b7; border-color: #065f46; }
    .badge.off { color: #fca5a5; border-color: #7f1d1d; }
    .link-actions { display: flex; gap: 5px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; max-width: 340px; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }
    .field label { display: block; font-size: 0.7rem; color: #94a3b8; margin-bottom: 4px; }
    .field input[type=text], .field input[type=number], .field select {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 7px 10px;
      color: #e2e8f0;
      font-size: 0.82rem;
      font-family: inherit;
    }
    .field input:focus, .field select:focus { outline: none; border-color: #3b82f6; }
    .checks { display: flex; gap: 16px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .checks label { font-size: 0.78rem; color: #cbd5e1; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .checks input[type=checkbox] { accent-color: #3b82f6; width: 15px; height: 15px; cursor: pointer; }
    .form-box { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 14px; margin-bottom: 14px; }
    .form-hint { font-size: 0.7rem; color: #64748b; margin-bottom: 12px; line-height: 1.5; }

    .interval-bar {
      background: #1e293b;
      border-radius: 12px;
      padding: 18px 20px;
      border: 1px solid #334155;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .interval-bar label { font-size: 0.875rem; font-weight: 500; color: #94a3b8; white-space: nowrap; }
    .interval-bar input[type=range] { flex: 1; min-width: 120px; accent-color: #3b82f6; }
    .interval-val {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.875rem;
      font-weight: 600;
      color: #f1f5f9;
      min-width: 60px;
      text-align: center;
    }

    #toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 50;
      max-width: 420px;
    }
    .toast {
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.8rem;
      line-height: 1.45;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    .toast.err { background: #7f1d1d; color: #fee2e2; border: 1px solid #b91c1c; }
    .toast.ok { background: #14532d; color: #dcfce7; border: 1px solid #16a34a; }
    .empty { font-size: 0.8rem; color: #64748b; padding: 10px 0; }
  </style>
</head>
<body>

<h1>Quiosco</h1>
<div class="subtitle">Consola de pantallas. Los cambios se guardan en config.json y se aplican sin reiniciar.</div>

<div class="interval-bar">
  <label>Intervalo de rotacion</label>
  <input type="range" id="slider" min="5" max="300" step="5" value="15">
  <span class="interval-val"><span id="sliderVal">15</span>s</span>
  <button class="btn btn-primary" onclick="applyInterval()">Aplicar</button>
  <a class="btn btn-ghost" href="/cast/startup-check" target="_blank" rel="noopener noreferrer"
     style="text-decoration:none">Debug interno</a>
</div>

<div class="grid" id="chromecasts"></div>

<div class="panel">
  <h2>
    Links
    <button class="btn btn-primary btn-sm" onclick="toggleAddForm()">+ Agregar link</button>
  </h2>
  <div id="addForm"></div>
  <div id="linksList"></div>
</div>

<div id="toast"></div>

<script>
  let state = { chromecasts: [], links: [], interval_seconds: 15, config_revision: 0 };
  let sliderActive = false;
  let editingLinkId = null;   // link cuyo formulario esta abierto
  let addingLink = false;
  let playlistDraft = {};     // cc_id -> array de link ids sin aplicar todavia

  function esc(value) {
    return String(value === null || value === undefined ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function formOpen() {
    return editingLinkId !== null || addingLink || Object.keys(playlistDraft).length > 0;
  }

  function toast(message, kind) {
    const el = document.createElement('div');
    el.className = 'toast ' + (kind || 'ok');
    el.textContent = message;
    document.getElementById('toast').appendChild(el);
    setTimeout(() => el.remove(), kind === 'err' ? 8000 : 3500);
  }

  async function api(method, path, body) {
    const options = { method };
    if (body !== undefined) {
      options.headers = { 'Content-Type': 'application/json' };
      options.body = JSON.stringify(body);
    }
    const res = await fetch(path, options);
    let payload = null;
    try { payload = await res.json(); } catch (e) { /* respuesta sin cuerpo */ }
    if (!res.ok) {
      const detail = (payload && payload.detail) || ('Error ' + res.status);
      toast(typeof detail === 'string' ? detail : JSON.stringify(detail), 'err');
      throw new Error(detail);
    }
    return payload;
  }

  async function fetchStatus() {
    try {
      const res = await fetch('/api/status');
      state = await res.json();
      render();
    } catch (e) { console.error(e); }
  }

  function render() {
    renderScreens();
    if (!formOpen()) {
      renderAddForm();
      renderLinks();
    }
    if (!sliderActive) {
      document.getElementById('slider').value = state.interval_seconds;
      document.getElementById('sliderVal').textContent = state.interval_seconds;
    }
  }

  // --- Pantallas ---

  function renderScreens() {
    const el = document.getElementById('chromecasts');
    el.innerHTML = state.chromecasts.map(cc => {
      const h = cc.health || { level: '', summary: '', cause: '', action: '' };
      const hasLinks = (cc.playlist_link_ids || []).length > 0;
      return `
      <div class="card">
        <div class="card-header">
          <div class="dot ${esc(h.level)}"></div>
          <div>
            <div class="card-title">${esc(cc.name)}</div>
            <div class="card-subtitle">${esc(cc.host)} &bull; ${esc(cc.id)}</div>
          </div>
        </div>

        <div class="diagnosis ${esc(h.level)}">
          <div class="summary">${esc(h.summary)}</div>
          ${h.cause ? `<div class="cause">${esc(h.cause)}</div>` : ''}
          ${h.action ? `<div class="action">${esc(h.action)}</div>` : ''}
        </div>

        <div class="now">
          En pantalla:
          ${cc.current_label
            ? `<span class="title">${esc(cc.current_label)}</span><div class="url">${esc(cc.current_url)}</div>`
            : '<span class="url">—</span>'}
        </div>

        <div class="btn-row">
          ${cc.rotating
            ? `<button class="btn btn-stop" onclick="act('/api/chromecasts/${esc(cc.id)}/stop','POST')">&#9632; Detener</button>`
            : `<button class="btn btn-start" ${!cc.connected || !hasLinks ? 'disabled' : ''}
                 onclick="act('/api/chromecasts/${esc(cc.id)}/start','POST')">&#9654; Iniciar rotacion</button>`}
          <button class="btn btn-ghost" ${!hasLinks ? 'disabled' : ''}
            onclick="skip('${esc(cc.id)}',-1)" title="Link anterior">&#9664;</button>
          <button class="btn btn-ghost" ${!hasLinks ? 'disabled' : ''}
            onclick="skip('${esc(cc.id)}',1)" title="Link siguiente">&#9654;</button>
          <button class="btn btn-ghost" ${!cc.connected ? 'disabled' : ''}
            onclick="act('/api/chromecasts/${esc(cc.id)}/relaunch','POST','Pantalla relanzada')"
            title="Recargar la display page en el Chromecast">&#8635; Relanzar</button>
        </div>

        ${renderPlaylistBox(cc)}
      </div>`;
    }).join('');
  }

  function renderPlaylistBox(cc) {
    const draft = playlistDraft[cc.id];
    const open = draft !== undefined;
    if (!open) {
      const label = cc.playlist === null
        ? `Todos los links (${(cc.playlist_link_ids || []).length})`
        : `Seleccion propia: ${(cc.playlist_link_ids || []).length} de ${state.links.length}`;
      return `
        <div class="playlist-box">
          <div class="playlist-summary">Que muestra esta pantalla: <strong>${esc(label)}</strong></div>
          <button class="btn btn-ghost btn-sm" onclick="openPlaylist('${esc(cc.id)}')">Elegir links</button>
        </div>`;
    }

    // En modo edicion se listan primero los elegidos, en su orden, y luego el resto.
    const chosen = draft.filter(id => state.links.some(l => l.id === id));
    const rest = state.links.filter(l => !chosen.includes(l.id)).map(l => l.id);
    const rows = chosen.concat(rest).map(id => {
      const link = state.links.find(l => l.id === id);
      const on = chosen.includes(id);
      const position = chosen.indexOf(id);
      return `
        <div class="playlist-item ${on ? '' : 'off'}">
          <input type="checkbox" ${on ? 'checked' : ''}
            onchange="togglePlaylistItem('${esc(cc.id)}','${esc(id)}')">
          <span class="pl-label">${esc(link.label)}${link.enabled ? '' : ' (deshabilitado)'}</span>
          ${on ? `
            <button class="btn btn-ghost btn-sm" ${position === 0 ? 'disabled' : ''}
              onclick="movePlaylistItem('${esc(cc.id)}','${esc(id)}',-1)">&#9650;</button>
            <button class="btn btn-ghost btn-sm" ${position === chosen.length - 1 ? 'disabled' : ''}
              onclick="movePlaylistItem('${esc(cc.id)}','${esc(id)}',1)">&#9660;</button>` : ''}
        </div>`;
    }).join('');

    return `
      <div class="playlist-box">
        <div class="playlist-summary">Elegi los links de esta pantalla y su orden:</div>
        ${rows}
        <div class="playlist-actions">
          <button class="btn btn-primary btn-sm" onclick="savePlaylist('${esc(cc.id)}')">Aplicar</button>
          <button class="btn btn-ghost btn-sm" onclick="usePlaylistAll('${esc(cc.id)}')">Usar todos</button>
          <button class="btn btn-ghost btn-sm" onclick="cancelPlaylist('${esc(cc.id)}')">Cancelar</button>
        </div>
      </div>`;
  }

  function openPlaylist(ccId) {
    const cc = state.chromecasts.find(c => c.id === ccId);
    playlistDraft[ccId] = (cc.playlist === null ? state.links.map(l => l.id) : cc.playlist).slice();
    renderScreens();
  }

  function cancelPlaylist(ccId) {
    delete playlistDraft[ccId];
    render();
  }

  function togglePlaylistItem(ccId, linkId) {
    const draft = playlistDraft[ccId];
    const at = draft.indexOf(linkId);
    if (at === -1) draft.push(linkId); else draft.splice(at, 1);
    renderScreens();
  }

  function movePlaylistItem(ccId, linkId, delta) {
    const draft = playlistDraft[ccId];
    const at = draft.indexOf(linkId);
    const to = at + delta;
    if (at === -1 || to < 0 || to >= draft.length) return;
    draft.splice(to, 0, draft.splice(at, 1)[0]);
    renderScreens();
  }

  function usePlaylistAll(ccId) {
    delete playlistDraft[ccId];
    api('PUT', `/api/chromecasts/${ccId}/playlist`, { link_ids: null })
      .then(() => { toast('La pantalla vuelve a mostrar todos los links'); fetchStatus(); })
      .catch(() => fetchStatus());
  }

  function savePlaylist(ccId) {
    const draft = playlistDraft[ccId];
    if (draft.length === 0 && !confirm('Esta pantalla quedara sin links que mostrar. ¿Continuar?')) return;
    delete playlistDraft[ccId];
    api('PUT', `/api/chromecasts/${ccId}/playlist`, { link_ids: draft })
      .then(() => { toast('Playlist actualizada'); fetchStatus(); })
      .catch(() => fetchStatus());
  }

  async function act(path, method, okMessage) {
    try {
      await api(method, path);
      if (okMessage) toast(okMessage);
    } catch (e) { /* el toast ya lo informo */ }
    fetchStatus();
  }

  async function skip(ccId, step) {
    try {
      const res = await api('POST', `/api/chromecasts/${ccId}/skip`, { step });
      if (res && res.current_label) toast('Ahora: ' + res.current_label);
    } catch (e) { /* ya informado */ }
    fetchStatus();
  }

  // --- Links ---

  function renderLinks() {
    const el = document.getElementById('linksList');
    if (state.links.length === 0) {
      el.innerHTML = '<div class="empty">No hay links configurados. Agrega el primero con el boton de arriba.</div>';
      return;
    }
    el.innerHTML = state.links.map((link, i) => {
      if (link.id === editingLinkId) return linkForm(link);
      return `
      <div class="link-row ${link.enabled ? '' : 'disabled'}">
        <div class="link-order">
          <button ${i === 0 ? 'disabled' : ''} onclick="moveLink('${esc(link.id)}',-1)" title="Subir">&#9650;</button>
          <button ${i === state.links.length - 1 ? 'disabled' : ''} onclick="moveLink('${esc(link.id)}',1)" title="Bajar">&#9660;</button>
        </div>
        <div class="link-info">
          <div class="name">${esc(link.label)}</div>
          <div class="href">${esc(link.url)}</div>
          <div class="badges">
            ${link.enabled ? '' : '<span class="badge off">Deshabilitado</span>'}
            ${link.zoom !== 1 ? `<span class="badge">zoom ${esc(link.zoom)}</span>` : ''}
            ${link.optional ? '<span class="badge">Opcional</span>' : ''}
            ${link.direct ? '<span class="badge">Directo</span>' : ''}
            ${isLive(link) ? '<span class="badge live">En vivo</span>' : ''}
            ${!isLive(link) && usesGif(link.url) ? '<span class="badge gif">GIF</span>' : ''}
          </div>
        </div>
        <div class="link-actions">
          ${state.chromecasts.map(cc => `
            <button class="btn btn-primary btn-sm" title="Castear a ${esc(cc.name)} ahora"
              ${!cc.connected ? 'disabled' : ''}
              onclick="castLink('${esc(cc.id)}','${esc(link.id)}')">
              &#9654; ${esc(shortName(cc.name))}
            </button>`).join('')}
          <button class="btn btn-ghost btn-sm" onclick="toggleEnabled('${esc(link.id)}',${!link.enabled})">
            ${link.enabled ? 'Deshabilitar' : 'Habilitar'}
          </button>
          ${!isLive(link) && usesGif(link.url)
            ? `<button class="btn btn-ghost btn-sm" onclick="recapture('${esc(link.id)}')"
                 title="Recapturar el GIF ahora, sin esperar el ciclo de 5 min">&#8635; GIF</button>`
            : ''}
          <button class="btn btn-ghost btn-sm" onclick="editLink('${esc(link.id)}')">Editar</button>
          <button class="btn btn-danger-ghost btn-sm" onclick="deleteLink('${esc(link.id)}')">Borrar</button>
        </div>
      </div>`;
    }).join('');
  }

  // Espejo de SCREENSHOT_SITES y del host PRTG en main.py: solo para decidir si
  // se ofrece el boton de recaptura.
  const GIF_HOSTS = ['cipotato.org', 'www.cgiar.org', 'cgiar.org', 'stats.uptimerobot.com', '172.25.0.22'];

  function usesGif(url) {
    return GIF_HOSTS.some(host => String(url).includes(host));
  }

  function isLive(link) {
    return link && link.render_mode === 'live_screenshot';
  }

  function shortName(name) {
    return String(name).replace('ITU ', '').replace('ITU_', '');
  }

  function linkForm(link) {
    const l = link || { id: '', url: '', label: '', zoom: 1, optional: false, direct: false, enabled: true, render_mode: 'iframe' };
    const isNew = !link;
    const prefix = isNew ? 'new' : 'edit';
    return `
      <div class="form-box">
        <div class="form-grid">
          <div class="field" style="grid-column: 1 / -1">
            <label>URL</label>
            <input type="text" id="${prefix}-url" value="${esc(l.url)}" placeholder="https://...">
          </div>
          <div class="field">
            <label>Nombre</label>
            <input type="text" id="${prefix}-label" value="${esc(l.label)}" placeholder="Como se llama esta pantalla">
          </div>
          <div class="field">
            <label>Zoom (0.1 a 4)</label>
            <input type="number" id="${prefix}-zoom" value="${esc(l.zoom)}" step="0.1" min="0.1" max="4">
          </div>
          <div class="field">
            <label>Como se muestra</label>
            <select id="${prefix}-render-mode">
              <option value="iframe" ${isLive(l) ? '' : 'selected'}>Pagina embebida</option>
              <option value="live_screenshot" ${isLive(l) ? 'selected' : ''}>Captura en vivo</option>
            </select>
          </div>
        </div>
        <div class="checks">
          <label><input type="checkbox" id="${prefix}-optional" ${l.optional ? 'checked' : ''}> Opcional</label>
          <label><input type="checkbox" id="${prefix}-direct" ${l.direct ? 'checked' : ''}> Directo</label>
          <label><input type="checkbox" id="${prefix}-enabled" ${l.enabled ? 'checked' : ''}> Habilitado</label>
        </div>
        <div class="form-hint">
          <strong>Opcional</strong>: si no responde se salta en la rotacion en vez de mostrar un error.
          <strong>Directo</strong>: se carga sin pasar por el proxy, para apps de la misma red que los Chromecasts.
          <strong>Zoom</strong> menor a 1 muestra mas contenido en pantalla.
          <strong>Captura en vivo</strong>: para paginas que no se dejan embeber; se publica un PNG
          que se refresca cada pocos segundos. Al pasar un link a este modo hay que reiniciar el
          servicio para que arranque su captura.
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="${isNew ? 'submitNewLink()' : `saveLink('${esc(l.id)}')`}">Guardar</button>
          <button class="btn btn-ghost" onclick="${isNew ? 'toggleAddForm()' : 'cancelEdit()'}">Cancelar</button>
        </div>
      </div>`;
  }

  function readForm(prefix) {
    return {
      url: document.getElementById(prefix + '-url').value.trim(),
      label: document.getElementById(prefix + '-label').value.trim(),
      zoom: parseFloat(document.getElementById(prefix + '-zoom').value),
      optional: document.getElementById(prefix + '-optional').checked,
      direct: document.getElementById(prefix + '-direct').checked,
      enabled: document.getElementById(prefix + '-enabled').checked,
      render_mode: document.getElementById(prefix + '-render-mode').value
    };
  }

  function renderAddForm() {
    document.getElementById('addForm').innerHTML = addingLink ? linkForm(null) : '';
  }

  function toggleAddForm() {
    addingLink = !addingLink;
    editingLinkId = null;
    renderAddForm();
    renderLinks();
  }

  function editLink(linkId) {
    editingLinkId = linkId;
    addingLink = false;
    renderAddForm();
    renderLinks();
  }

  function cancelEdit() {
    editingLinkId = null;
    render();
  }

  async function submitNewLink() {
    const payload = readForm('new');
    try {
      await api('POST', '/api/links', payload);
      addingLink = false;
      toast('Link agregado');
    } catch (e) { return; }  // el formulario queda abierto con lo escrito
    await fetchStatus();
  }

  async function saveLink(linkId) {
    const payload = readForm('edit');
    try {
      await api('PATCH', '/api/links/' + linkId, payload);
      editingLinkId = null;
      toast('Link actualizado');
    } catch (e) { return; }
    await fetchStatus();
  }

  async function toggleEnabled(linkId, enabled) {
    try {
      await api('PATCH', '/api/links/' + linkId, { enabled });
      toast(enabled ? 'Link habilitado' : 'Link deshabilitado: se saca de todas las pantallas');
    } catch (e) { /* ya informado */ }
    fetchStatus();
  }

  async function deleteLink(linkId) {
    const link = state.links.find(l => l.id === linkId);
    if (!confirm(`¿Borrar "${link ? link.label : linkId}"? Tambien se quita de las playlists.`)) return;
    try {
      await api('DELETE', '/api/links/' + linkId);
      toast('Link borrado');
    } catch (e) { /* ya informado */ }
    fetchStatus();
  }

  async function moveLink(linkId, delta) {
    const ids = state.links.map(l => l.id);
    const at = ids.indexOf(linkId);
    const to = at + delta;
    if (at === -1 || to < 0 || to >= ids.length) return;
    ids.splice(to, 0, ids.splice(at, 1)[0]);
    try {
      await api('PUT', '/api/links/order', { link_ids: ids });
    } catch (e) { /* ya informado */ }
    fetchStatus();
  }

  async function recapture(linkId) {
    try {
      await api('POST', `/api/links/${linkId}/recapture`);
      toast('Recaptura encolada. El GIF tarda unos segundos en actualizarse.');
    } catch (e) { /* ya informado */ }
  }

  async function castLink(ccId, linkId) {
    const link = state.links.find(l => l.id === linkId);
    if (!link) return;
    try {
      await api('POST', `/api/chromecasts/${ccId}/cast`, { url: link.url, label: link.label });
      toast('Casteado: ' + link.label);
    } catch (e) { /* ya informado */ }
    fetchStatus();
  }

  // --- Intervalo ---

  const slider = document.getElementById('slider');
  slider.addEventListener('input', e => {
    sliderActive = true;
    document.getElementById('sliderVal').textContent = e.target.value;
  });
  slider.addEventListener('change', () => { sliderActive = false; });

  async function applyInterval() {
    try {
      await api('PUT', '/api/config/interval', { seconds: parseFloat(slider.value) });
      toast('Intervalo guardado');
    } catch (e) { /* ya informado */ }
    sliderActive = false;
    fetchStatus();
  }

  fetchStatus();
  setInterval(fetchStatus, 5000);
</script>
</body>
</html>
