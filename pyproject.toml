[project]
name = "quiosco"
version = "0.1.8"
description = "FastAPI service that rotates web pages on Chromecasts"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.3",
    "httpx>=0.28.1",
    "pillow>=12.2.0",
    "playwright>=1.58.0",
    "pychromecast>=14.0.10",
    "uvicorn[standard]>=0.44.0",
]

[project.scripts]
quiosco-discover = "quiosco.discover:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quiosco"]
