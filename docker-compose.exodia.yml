# Despliegue en produccion (exodia, Linux) usando la imagen publicada en Docker Hub.
# No requiere clonar el repo completo: basta esta carpeta con config.json.
#
#   docker compose -f docker-compose.exodia.yml up -d
#
# Notas:
# - network_mode: host permite mDNS a nivel de host y evita mapeos de puertos.
# - PROXY_BASE por defecto apunta a la IP de exodia (172.25.21.37); si el servicio
#   se muda de maquina, sobreescribir con la IP nueva (la que ven los Chromecasts).
# - El mDNS no cruza subredes: si un Chromecast cambia de IP, el recovery lo
#   reencuentra escaneando el /24 de su ultima IP conocida (>= 0.1.1).
services:
  quiosco:
    image: cipotato/quiosco:0.1.12
    init: true
    network_mode: host
    environment:
      # El contenedor corre en UTC si no se dice lo contrario, y los paneles
      # sellan la hora con datetime.now(): sin esto el reloj sale 5 h
      # adelantado. La imagen ya trae tzdata.
      - TZ=${TZ:-America/Lima}
      - PROXY_BASE=${PROXY_BASE:-http://172.25.21.37:8000}
      # Credenciales de PRTG para /panel/prtg. Viven en el .env de la
      # maquina, nunca en config.json: ese se lee por SSH, se respalda y
      # se edita desde la consola web. Es el passhash, no la contrasena.
      - PRTG_USER=${PRTG_USER:-}
      - PRTG_PASSHASH=${PRTG_PASSHASH:-}
      # URL con SAS del flow OPS - ITSM Panel Aggregate (http). Es la
      # credencial: va en el .env de la maquina, nunca en config.json.
      - ITSM_PANEL_FLOW_URL=${ITSM_PANEL_FLOW_URL:-}
    volumes:
      - ./config.json:/app/config.json
      - ./static/screenshots:/app/static/screenshots
      - ./data:/app/data
    pids_limit: 512
    mem_limit: 2g
    cpus: "4.0"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
