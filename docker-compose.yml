services:
  quiosco:
    build: .
    init: true
    network_mode: host
    environment:
      # El contenedor corre en UTC si no se dice lo contrario, y los paneles
      # sellan la hora con datetime.now(): sin esto el reloj sale 5 h
      # adelantado. La imagen ya trae tzdata.
      - TZ=${TZ:-America/Lima}
      - PROXY_BASE=${PROXY_BASE:-}
      # Credenciales de PRTG para /panel/prtg. Viven en el .env de la
      # maquina, nunca en config.json: ese se lee por SSH, se respalda y
      # se edita desde la consola web. Es el passhash, no la contrasena.
      - PRTG_USER=${PRTG_USER:-}
      - PRTG_PASSHASH=${PRTG_PASSHASH:-}
      # URL con SAS del flow OPS - ITSM Panel Aggregate (http). Es la
      # credencial: va en el .env de la maquina, nunca en config.json.
      - ITSM_PANEL_FLOW_URL=${ITSM_PANEL_FLOW_URL:-}
    volumes:
      - ./config.json:/app/config.json
      - ./static/screenshots:/app/static/screenshots
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
