services:
  quiosco:
    build: .
    init: true
    network_mode: host
    environment:
      - PROXY_BASE=${PROXY_BASE:-}
    volumes:
      - ./config.json:/app/config.json
      - ./static/screenshots:/app/static/screenshots
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
