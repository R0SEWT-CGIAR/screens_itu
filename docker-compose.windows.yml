# Despliegue en Windows (Docker Desktop) usando la imagen publicada en Docker Hub.
# No requiere clonar el repo completo: basta esta carpeta con config.json y .env.
#
#   docker compose -f docker-compose.windows.yml up -d
#
# Notas Windows:
# - network_mode: host NO funciona en Docker Desktop; se mapea el puerto 8000.
# - PROXY_BASE debe ser la IP LAN de la compu Windows (la que ven los Chromecasts).
# - El discovery mDNS no funciona desde el contenedor en Windows. Desde 0.1.1 el
#   recovery reencuentra solo a un Chromecast que cambio de IP (escaneo TCP del /24
#   de su ultima IP conocida); igual se recomienda reserva DHCP.
services:
  quiosco:
    image: cipotato/quiosco:0.1.13
    init: true
    ports:
      - "8000:8000"
    environment:
      # El contenedor corre en UTC si no se dice lo contrario, y los paneles
      # sellan la hora con datetime.now(): sin esto el reloj sale 5 h
      # adelantado. La imagen ya trae tzdata.
      - TZ=${TZ:-America/Lima}
      - PROXY_BASE=${PROXY_BASE:-}
      # Credenciales de PRTG para /panel/prtg. Viven en el .env de la
      # maquina, nunca en config.json: ese se lee por SSH, se respalda y
      # se edita desde la consola web. Es el passhash, no la contrasena.
      - PRTG_USER=${PRTG_USER:-}
      - PRTG_PASSHASH=${PRTG_PASSHASH:-}
      # URL con SAS del flow OPS - ITSM Panel Aggregate (http). Es la
      # credencial: va en el .env de la maquina, nunca en config.json.
      - ITSM_PANEL_FLOW_URL=${ITSM_PANEL_FLOW_URL:-}
    volumes:
      - ./config.json:/app/config.json
      - ./static/screenshots:/app/static/screenshots
      # Fotos de los tecnicos (48x48, bajadas una vez por Graph). Van por
      # volumen y no en la imagen: cambian cuando entra o sale alguien, no
      # cuando se publica una version.
      - ./static/photos:/app/static/photos
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
