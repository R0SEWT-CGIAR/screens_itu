# Despliegue en Windows (Docker Desktop) usando la imagen publicada en Docker Hub.
# No requiere clonar el repo completo: basta esta carpeta con config.json y .env.
#
#   docker compose -f docker-compose.windows.yml up -d
#
# Notas Windows:
# - network_mode: host NO funciona en Docker Desktop; se mapea el puerto 8000.
# - PROXY_BASE debe ser la IP LAN de la compu Windows (la que ven los Chromecasts).
# - El discovery mDNS no funciona desde el contenedor en Windows. Desde 0.1.1 el
#   recovery reencuentra solo a un Chromecast que cambio de IP (escaneo TCP del /24
#   de su ultima IP conocida); igual se recomienda reserva DHCP.
services:
  quiosco:
    image: cipotato/quiosco:0.1.5
    init: true
    ports:
      - "8000:8000"
    environment:
      - PROXY_BASE=${PROXY_BASE:-}
    volumes:
      - ./config.json:/app/config.json
      - ./static/screenshots:/app/static/screenshots
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
